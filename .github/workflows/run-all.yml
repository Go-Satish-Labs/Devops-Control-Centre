
name: Run All DevOps Workflows

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  run-all:
    name: Trigger All DevOps Workflows
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DCC_APP_ID }}
          private-key: ${{ secrets.DCC_APP_PRIVATE_KEY }}
          owner: Go-Satish-Labs

      - name: Trigger DevOps Workflows
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e

          REPO="Go-Satish-Labs/DevOps-Control-Centre"

          echo "Starting DevOps workflow dispatch..."

          gh workflow run "Branch Ruleset Enforcement" \
            --repo "$REPO" --ref main -f mode=enforce

          gh workflow run "Daily Organization Report" \
            --repo "$REPO" --ref main

          gh workflow run "Organization Audit" \
            --repo "$REPO" --ref main

          gh workflow run "Report Generation" \
            --repo "$REPO" --ref main

          gh workflow run "Repository Discovery" \
            --repo "$REPO" --ref main

          echo "All requested DevOps workflows dispatched."

      - name: Completion Summary
        run: |
          echo "## DevOps Workflow Dispatch" >> $GITHUB_STEP_SUMMARY
          echo "All non-Copilot DevOps workflows have been triggered." >> $GITHUB_STEP_SUMMARY
