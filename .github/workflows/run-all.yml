
name: Run All DevOps Workflows

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  run-all:
    name: Trigger All Workflows
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DCC_APP_ID }}
          private-key: ${{ secrets.DCC_APP_PRIVATE_KEY }}
          owner: Go-Satish-Labs
          repositories: DevOps-Control-Centre

      - name: Trigger All Workflows
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run organization-audit.yml --repo Go-Satish-Labs/DevOps-Control-Center --ref main

          gh workflow run repository-discovery.yml --repo Go-Satish-Labs/DevOps-Control-Center --ref main

          gh workflow run branch-ruleset-enforcement.yml --repo Go-Satish-Labs/DevOps-Control-Center --ref main -f mode=dry-run

      - name: Completed
        run: echo "All workflows have been dispatched successfully."
