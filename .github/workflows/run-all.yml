name: Run All DevOps Workflows

on:
  workflow_dispatch:
    inputs:
      ruleset_mode:
        description: "Ruleset mode. dry-run is safe. To enforce, run Branch Ruleset Enforcement by itself."
        type: choice
        options: [dry-run, audit-only]
        default: dry-run

permissions:
  actions: write
  contents: read

jobs:
  run-all:
    name: Trigger all DevOps workflows
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DCC_APP_ID }}
          private-key: ${{ secrets.DCC_APP_PRIVATE_KEY }}
          owner: Go-Satish-Labs

      - name: Trigger DevOps workflows
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: Go-Satish-Labs/Devops-Control-Centre
          RULESET_MODE: ${{ inputs.ruleset_mode }}
        run: |
          failures=0

          dispatch() {
            local name="$1"
            shift
            if gh workflow run "$name" --repo "$REPO" --ref main "$@"; then
              echo "dispatched: $name"
            else
              echo "FAILED to dispatch: $name"
              failures=$((failures + 1))
            fi
          }

          dispatch "Organization Audit"
          dispatch "Repository Discovery"
          dispatch "Branch Ruleset Enforcement" -f mode="$RULESET_MODE"
          dispatch "Daily Organization Report"

          {
            echo "## DevOps workflow dispatch"
            echo ""
            echo "- Ruleset mode: $RULESET_MODE"
            echo "- Failed dispatches: $failures"
            echo ""
            echo "Organization Audit runs first. Daily Organization Report reads the committed report,"
            echo "so it posts the previous audit's data unless it runs after the audit finishes."
            echo "Report Generation runs automatically after a successful audit."
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$failures" -eq 0 ]
