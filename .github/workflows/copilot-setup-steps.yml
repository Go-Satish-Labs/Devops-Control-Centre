name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Ensure Copilot runtime node fallback path
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$(command -v node)"
          TARGET_DIR="$RUNNER_TEMP/ghcca-node/node/bin"
          mkdir -p "$TARGET_DIR"
          ln -sf "$NODE_PATH" "$TARGET_DIR/node"
          "$TARGET_DIR/node" --version
