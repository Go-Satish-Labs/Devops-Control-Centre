name: Branch Ruleset Enforcement

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run, audit-only, or enforce (creates missing rulesets)"
        type: choice
        options: [dry-run, audit-only, enforce]
        default: dry-run
      confirm:
        description: "Type ENFORCE to allow enforce mode"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: dcc-rulesets
  cancel-in-progress: false

env:
  ORG: Go-Satish-Labs
  CONTROL_REPO: Devops-Control-Centre
  RULESET_NAME: DCC Default Branch Protection

jobs:
  rulesets:
    name: Evaluate and create branch rulesets
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create GitHub App installation token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DCC_APP_ID }}
          private-key: ${{ secrets.DCC_APP_PRIVATE_KEY }}
          owner: Go-Satish-Labs

      - name: Check for a ruleset on the control repository
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'enforce' && inputs.confirm == 'ENFORCE' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.DCC_PAT || github.token }}
        run: |
          set -uo pipefail
          echo "Checking '$RULESET_NAME' on $ORG/$CONTROL_REPO"
          ids=$(gh api "repos/$ORG/$CONTROL_REPO/rulesets" \
              --jq ".[] | select(.name == \"$RULESET_NAME\") | .id" 2>/tmp/err) || {
            echo "Skipped: $(cat /tmp/err)"
            echo "If a ruleset exists, delete it by hand in Settings > Rules > Rulesets."
            exit 0
          }
          for id in $ids; do
            echo "Deleting repository ruleset $id"
            gh api -X DELETE "repos/$ORG/$CONTROL_REPO/rulesets/$id"
          done
          echo "Control repository check complete."

      - name: Evaluate and create rulesets
        env:
          DCC_TOKEN: ${{ steps.app-token.outputs.token || secrets.DCC_PAT || '' }}
          DCC_AUTH_MODE: ${{ steps.app-token.outputs.token != '' && 'github-app' || (secrets.DCC_PAT != '' && 'personal-access-token') || 'github-token-limited' }}
          GITHUB_TOKEN: ${{ github.token }}
          # Scheduled runs create missing rulesets (create-only). Manual runs use the chosen mode.
          RULESET_MODE: ${{ github.event_name == 'schedule' && 'enforce' || inputs.mode || 'dry-run' }}
          DCC_CONFIRM_ENFORCE: ${{ github.event_name == 'schedule' && 'ENFORCE' || inputs.confirm }}
        run: python -m src.cli rulesets --mode "$RULESET_MODE" --output build

      - name: Upload rulesets report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcc-rulesets-report
          path: build/
          retention-days: 30
          if-no-files-found: ignore
