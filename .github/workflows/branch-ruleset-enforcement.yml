name: Branch Ruleset Enforcement

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default), audit-only, or enforce (creates rulesets)"
        type: choice
        options: [dry-run, audit-only, enforce]
        default: dry-run
      confirm:
        description: "Type ENFORCE to allow enforce mode"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: dcc-rulesets
  cancel-in-progress: false

env:
  ORG: Go-Satish-Labs
  CONTROL_REPO: Devops-Control-Centre
  RULESET_NAME: DCC Default Branch Protection

jobs:
  rulesets:
    name: Evaluate branch rulesets
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create GitHub App installation token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DCC_APP_ID }}
          private-key: ${{ secrets.DCC_APP_PRIVATE_KEY }}
          owner: Go-Satish-Labs

      - name: Remove branch rulesets from the control repository
        if: ${{ inputs.mode == 'enforce' && inputs.confirm == 'ENFORCE' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.DCC_PAT || github.token }}
        run: |
          set -euo pipefail
          echo "Removing '$RULESET_NAME' from $ORG/$CONTROL_REPO"

          # Repository-level ruleset on the control repository (exact name match only)
          for id in $(gh api "repos/$ORG/$CONTROL_REPO/rulesets" \
              --jq ".[] | select(.name == \"$RULESET_NAME\") | .id"); do
            echo "Deleting repository ruleset $id"
            gh api -X DELETE "repos/$ORG/$CONTROL_REPO/rulesets/$id"
          done

          # Organization-level ruleset: keep it, but exclude the control repository
          for id in $(gh api "orgs/$ORG/rulesets" \
              --jq ".[] | select(.name == \"$RULESET_NAME\") | .id"); do
            gh api "orgs/$ORG/rulesets/$id" > current.json
            jq --arg repo "$CONTROL_REPO" '
              {name, target, enforcement, conditions, rules, bypass_actors}
              | if .conditions.repository_name then
                  .conditions.repository_name.exclude =
                    (((.conditions.repository_name.exclude // []) + [$repo]) | unique)
                else . end
            ' current.json > update.json
            echo "Excluding $CONTROL_REPO from organization ruleset $id"
            gh api -X PUT "orgs/$ORG/rulesets/$id" --input update.json
          done

          echo "Control repository is clear of enforced rulesets."

      - name: Evaluate rulesets
        env:
          DCC_TOKEN: ${{ steps.app-token.outputs.token || secrets.DCC_PAT || '' }}
          DCC_AUTH_MODE: ${{ steps.app-token.outputs.token != '' && 'github-app' || (secrets.DCC_PAT != '' && 'personal-access-token') || 'github-token-limited' }}
          GITHUB_TOKEN: ${{ github.token }}
          DCC_CONFIRM_ENFORCE: ${{ inputs.confirm }}
          RULESET_MODE: ${{ github.event_name == 'schedule' && 'dry-run' || inputs.mode || 'dry-run' }}
        run: python -m src.cli rulesets --mode "$RULESET_MODE" --output build

      - name: Upload rulesets report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcc-rulesets-report
          path: build/
          retention-days: 30
          if-no-files-found: ignore
