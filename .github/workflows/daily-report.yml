name: Daily Organization Report

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dcc-notify
  cancel-in-progress: false

jobs:
  notify:
    name: Post daily discussion and sync issues
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create GitHub App installation token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DCC_APP_ID }}
          private-key: ${{ secrets.DCC_APP_PRIVATE_KEY }}
          owner: Go-Satish-Labs
      - name: Post discussion and sync issues
        env:
          DCC_TOKEN: ${{ steps.app-token.outputs.token || secrets.DCC_PAT || '' }}
          DCC_AUTH_MODE: ${{ steps.app-token.outputs.token != '' && 'github-app' || (secrets.DCC_PAT != '' && 'personal-access-token') || 'github-token-limited' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.cli notify --source reports/organization-health.json --output build
      - name: Upload notification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcc-notify-output
          path: build/
          retention-days: 14
          if-no-files-found: ignore
