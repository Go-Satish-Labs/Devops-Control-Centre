name: Report Generation

# Runs after a successful Organization Audit. Publishes the reports on a new branch,
# opens a pull request, and enables auto-merge so it merges once the rules are satisfied.
on:
  workflow_run:
    workflows: ["Organization Audit"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: dcc-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Validate, publish and open pull request
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download audit output
        uses: actions/download-artifact@v4
        with:
          name: dcc-audit-output
          path: build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate artifacts
        run: python -m src.cli validate --source build

      - name: Publish artifacts
        run: python -m src.cli publish --source build --target .

      - name: Create branch, commit and open pull request
        run: |
          set -euo pipefail
          git config user.name "devops-control-center[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Unique per run, so a push can never collide with an earlier branch.
          BRANCH="automation/report-update-${RUN_ID}-$(date -u +%Y%m%d-%H%M%S)"

          git add assets reports
          if git diff --cached --quiet; then
            echo "No report changes to publish."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git commit -m "chore(reports): update organization health [skip ci]"
          git push origin "HEAD:refs/heads/$BRANCH"

          pr_url=$(gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH" \
            --title "Update organization health reports" \
            --body "Automated report update from Organization Audit run ${RUN_ID}.")
          echo "Opened $pr_url"

          gh pr merge "$BRANCH" --auto --squash --delete-branch \
            || echo "::warning::Auto-merge could not be enabled. Merge $pr_url manually, or enable 'Allow auto-merge'."
